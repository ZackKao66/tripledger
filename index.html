<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>旅帳｜出國記帳＆分帳</title>
<meta name="description" content="出國記帳、自動換算臺銀匯率、朋友分帳">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16191b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅帳">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#16191b; --ink2:#363b3f; --sub:#62676c; --line:#e3dfd5; --line2:#eeebe4;
  --pri:#1f4e45; --pri-soft:#e6eeeb; --warm:#9a5532; --warm-soft:#f6ede7; --red:#a23b32; --ok:#2c6b4f;
  --on-ink:#ffffff; --hero-bg:#16191b; --hero-fg:#f3efe6; --mask:rgba(18,20,22,.42); --kp:#ffffff; --kp-op:#eeebe4;
  --num:"Inter","Noto Sans TC",system-ui,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --ink:#ece8df; --ink2:#cfcbc2; --sub:#a1a6ab; --line:#2d3135; --line2:#25292c;
  --pri:#86c2b1; --pri-soft:#1c2c28; --warm:#e39a72; --warm-soft:#33261f; --red:#ec8a7f; --ok:#86c9a3;
  --on-ink:#16191b; --hero-bg:#1f2427; --hero-fg:#f3efe6; --mask:rgba(0,0,0,.62); --kp:#22262a; --kp-op:#2b3034; color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --ink:#ece8df; --ink2:#cfcbc2; --sub:#a1a6ab; --line:#2d3135; --line2:#25292c;
  --pri:#86c2b1; --pri-soft:#1c2c28; --warm:#e39a72; --warm-soft:#33261f; --red:#ec8a7f; --ok:#86c9a3;
  --on-ink:#16191b; --hero-bg:#1f2427; --hero-fg:#f3efe6; --mask:rgba(0,0,0,.62); --kp:#22262a; --kp-op:#2b3034; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(116px + env(safe-area-inset-bottom))}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;gap:12px}
.brand{flex:1}
.brand h1{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:700;margin:0;letter-spacing:2px}
.brand .en{font-family:var(--num);font-size:10px;letter-spacing:3px;color:var(--sub);font-weight:600;margin-top:2px}
.top h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.status.local i{background:var(--warm)} .status.load i,.status.sync i{background:#c9b48a}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.wrap{padding:0 16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.sec.tight{padding:4px 18px}
.sec-t{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 4px}
.sec-d{font-size:12.5px;color:var(--sub);line-height:1.65;margin:0 0 12px}
.eyebrow{font-family:"Noto Sans TC",sans-serif;font-size:13px;letter-spacing:.5px;font-weight:700;color:var(--ink2);margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.eyebrow .lnk{letter-spacing:.5px;text-transform:none;font-family:"Noto Sans TC",sans-serif}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12.5px;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--ink);color:var(--on-ink);min-height:48px;border-radius:12px;padding:14px 16px;font-weight:500;width:100%;font-size:15px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 35%,transparent)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:10px;letter-spacing:.5px;min-height:44px}
.btn.xs{padding:8px 14px;font-size:13px;width:auto;border-radius:99px;letter-spacing:.3px;min-height:40px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--fab,var(--ink));color:var(--on-fab,var(--on-ink));font-weight:500;font-size:15px;letter-spacing:2px;padding:16px 30px;border-radius:99px;box-shadow:0 10px 30px rgba(22,25,27,.28);z-index:20;display:flex;align-items:center;gap:8px}
.mono{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:1px;color:var(--ink2);background:var(--bg);flex:none}
.trip{display:flex;gap:14px;align-items:center;cursor:pointer;padding:16px 18px}
.trip h3{margin:0 0 3px;font-size:16px;font-weight:700}
.trip .amt{font-weight:600;font-size:16px;text-align:right;white-space:nowrap}
.empty{text-align:center;padding:52px 24px;color:var(--sub);line-height:1.8}
.empty .t{font-family:"Noto Serif TC",serif;font-size:18px;color:var(--ink);margin-bottom:6px}
.hero{background-color:var(--hero-bg);background-image:linear-gradient(100deg,var(--hero-bg) 45%,color-mix(in srgb,var(--hero-bg) 60%,transparent) 68%,transparent 100%),var(--pat,none);background-size:auto;color:var(--hero-fg);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;margin:0 16px 14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(243,239,230,.08)}
.hero .k{font-family:var(--num);font-size:11.5px;letter-spacing:2.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .k .lb{opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .k .lb:before{content:"";display:inline-block;width:22px;height:4px;background:var(--stripe,rgba(243,239,230,.5));vertical-align:middle;margin-right:8px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
body[data-dest] .hero:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripe);z-index:1}
.hero .k .gr{letter-spacing:.5px;font-weight:500;opacity:.92;font-family:"Noto Serif TC",serif;font-size:12px;white-space:nowrap}
.mono.dest{color:#f3efe6;border-color:transparent}
.themepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themepick button{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);text-align:left;font-size:12.5px;padding:0}
.themepick button .sw{height:38px}
.themepick button span{display:block;padding:7px 9px}
.themepick button.on{border:2px solid var(--ink)}
.hero .v{font-size:34px;font-weight:600;margin:6px 0 14px}
.hero .v small{font-size:15px;opacity:.9;margin-right:6px;font-weight:500}
.hero .grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(243,239,230,.18);padding-top:12px}
.hero .grid span{font-size:12px;opacity:.9}
.hero .grid b{display:block;font-size:14px;color:var(--hero-fg);font-weight:500;margin-top:3px}
.bar{height:3px;background:rgba(243,239,230,.15);border-radius:9px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:#c9b48a}
.bar.over>i{background:#d98a6a}
.budgetline{display:flex;justify-content:space-between;font-size:12px;opacity:.92;margin-top:6px}
.stickybar{position:sticky;top:0;padding-top:env(safe-area-inset-top)!important;z-index:10;background:var(--bg);padding:0 16px}
.compact{display:none;align-items:center;gap:10px;padding:10px 2px 8px}
.stickybar.on .compact{display:flex}
.compact .nm{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact .am{text-align:right;line-height:1.2}
.compact .am b{font-size:15px;font-weight:600}
.tabs{display:flex;margin:0 0 6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:14px 2px;font-weight:500;color:var(--sub);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:1px}
.tabs button.on{color:var(--ink);border-color:var(--tabline,var(--ink));font-weight:700}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:20px 4px 8px;font-weight:500;letter-spacing:.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.exp{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.exp:last-child{border-bottom:none}
.ic{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;color:var(--ink2);flex:none}
.ic.sm{width:30px;height:30px;border-radius:9px}
.exp .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .r{text-align:right;white-space:nowrap}
.exp .r b{display:block;font-size:15px;font-weight:600}
.meta-line{font-size:12px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:#c4c0b6;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;min-height:40px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;margin:0 6px 8px 0;color:var(--ink2)}
.chip svg.i{width:16px;height:16px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.add{border-style:dashed;color:var(--sub)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.pill.w{border-color:#e7cfc1;color:var(--warm)}
.pill.g{border-color:#c9dbd5;color:var(--pri)}
.pill.k{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pill.w{border-color:color-mix(in srgb,var(--warm) 40%,transparent)}
.pill.g{border-color:color-mix(in srgb,var(--pri) 40%,transparent)}
.mask{position:fixed;inset:0;background:var(--mask);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;overflow-anchor:none;scroll-padding-bottom:110px;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grip{width:40px;height:4px;border-radius:9px;background:#d6d1c6;margin:4px auto 16px}
.sheet h3{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:10px}
.sheet h3 .grow{flex:1}
label.l{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500;color:var(--sub);margin:18px 0 8px;letter-spacing:.5px}
.lnk{font-size:13px;color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;padding:8px 4px;margin:-8px 0}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border .15s}
.inp:focus{border-color:var(--ink)}
.inp.sm{padding:9px 10px;font-size:15px}
.amtbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.amtrow{display:flex;align-items:center;gap:8px}
.cursel{appearance:none;-webkit-appearance:none;background:var(--bg);color:var(--ink);font-family:var(--num);font-weight:600;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;letter-spacing:1px}
.amtinp{flex:1;min-width:0;border:none;outline:none;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:36px;font-weight:600;text-align:right;background:transparent;letter-spacing:-.02em}
.conv{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--sub);line-height:1.8}
.conv .tot{display:flex;justify-content:space-between;align-items:baseline}
.conv .tot b{color:var(--ink);font-size:18px;font-weight:600}
.conv .ln{display:flex;justify-content:space-between;gap:10px}
.conv .fee{color:var(--warm)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))} .seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:0 4px;border:none;border-radius:10px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;min-width:0;transition:background .15s,color .15s}
.seg button svg.i{width:17px;height:17px;flex:none}
.seg button.on{background:var(--ink);color:var(--on-ink);font-weight:600}
.seg.compact button{font-size:12.5px}
@media (max-width:380px){ .seg.compact button svg.i{display:none} }
.note{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--warm);padding:2px 0 2px 10px;margin-top:12px;line-height:1.7}
.note.g{border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clist{max-height:250px;overflow:auto;margin-top:8px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.clist button{display:flex;width:100%;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);text-align:left}
.clist button:last-child{border-bottom:none}
.clist button.on{background:var(--pri-soft)}
.clist .code{font-family:var(--num);font-weight:600;font-size:12px;color:var(--sub);width:28px}
.member{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 8px 5px 5px;margin:0 6px 8px 0;font-size:14px}
.member .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.member .x svg.i{width:14px;height:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:12px;flex:none}
.av.k{background:var(--bg)!important;color:var(--ink);border:1px solid var(--ink)}
.av.k svg.i{width:15px;height:15px}
.prow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:none}
.arrow{color:var(--sub)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--red);font-weight:600}
.statbar{height:4px;background:var(--line2);border-radius:9px;overflow:hidden;margin-top:8px}
.statbar i{display:block;height:100%;background:var(--ink)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th,table.rt td{padding:9px 4px;border-bottom:1px solid var(--line2);text-align:right}
table.rt th:first-child,table.rt td:first-child{text-align:left}
table.rt th{color:var(--sub);font-weight:500;font-size:11.5px;letter-spacing:.5px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:92%;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto}
.toast button{color:var(--on-ink);font-weight:700;text-decoration:underline;padding:4px 2px;white-space:nowrap}
.dlg{background:var(--surface);border-radius:18px;padding:22px;margin:auto 24px;max-width:360px;width:100%}
.mask.center{align-items:center}
textarea.inp{min-height:150px;font-size:14px;line-height:1.6}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.iconpick button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--ink2)}
.iconpick button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.step{display:flex;gap:12px;margin-bottom:14px}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--num);font-size:12px;font-weight:600;flex:none;margin-top:1px}
.step p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.share3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.share3 a,.share3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;color:var(--ink);text-decoration:none;line-height:1.4}
.share3 .lg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink2);word-break:break-all}
.toggle{width:44px;height:26px;border-radius:99px;background:#d8d3c8;position:relative;flex:none;transition:.2s}
.toggle{min-width:44px}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--ink)} .toggle.on:after{left:21px}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 10px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;font-size:12.5px;line-height:1.5}
.recent button b{display:block;font-size:13px;font-weight:500;color:var(--ink)}
.scanbtn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px}
.scanbtn svg.i{width:17px;height:17px}
.wcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface)}
.wcard .big{font-size:22px;font-weight:600}
.meter{height:4px;background:var(--line2);border-radius:9px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--pri)}
.meter.low i{background:var(--warm)}
.wline{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.wwho{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:8px}
.recrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.recrow:last-child{border-bottom:none}

.kp button:active{transform:scale(.96);background:var(--line)}
.more{display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px;margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-height:52px}
.more .sum{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more svg.i{transition:transform .2s}
.more.open svg.i{transform:rotate(90deg)}
.sheetfoot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));margin:14px -18px calc(-24px - env(safe-area-inset-bottom));padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 22%);z-index:3}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line2)}
.swipe:last-child{border-bottom:none}
.swipe .exp{border-bottom:none;background:var(--surface);position:relative;z-index:1;transition:transform .2s;touch-action:pan-y}
.swipe .acts{position:absolute;right:-16px;top:0;bottom:0;display:flex}

.swipe .acts .ed{background:#5d6469}.swipe .acts .dl{background:#a23b32}
.feed{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:14px}

.feed .it .grow{line-height:1.5}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}

.onb{text-align:center;padding:10px 6px 4px}
.onb .ill{width:84px;height:84px;border-radius:24px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;margin:8px auto 18px}

function evalExpr(x){
  const tk=String(x||"").match(/\d*\.?\d+|[+\-*/]/g); if(!tk) return null;
  while(tk.length&&/[+\-*/]/.test(tk[tk.length-1])) tk.pop();
  if(!tk.length) return null;
  const a=[]; let i=0;
  if(/[+\-*/]/.test(tk[0])) return null;
  a.push(parseFloat(tk[0])); i=1;
  const ops=[];
  while(i<tk.length){ const op=tk[i], n=parseFloat(tk[i+1]); if(!isFinite(n)) return null;
    if(op==="*") a[a.length-1]*=n; else if(op==="/") a[a.length-1]=n===0?NaN:a[a.length-1]/n; else {ops.push(op); a.push(n);} i+=2; }
  let r=a[0]; ops.forEach((op,j)=>{ r = op==="+"? r+a[j+1] : r-a[j+1]; });
  return isFinite(r)?Math.round(r*100)/100:null;
}

/* ===================== 匯率與計算 ===================== */
function avgRate(holder,cur){
  let amt=0,twd=0;
  for(const e of Object.values(S.entries)){
    if(e.cur!==cur) continue;
    if(e.kind==="exchange" && e.member===holder){amt+=Number(e.amount);twd+=Number(e.twd);}
    if(holder===KITTY && e.kind==="kitty_in"){amt+=Number(e.amount);twd+=Number(e.twd);}
  }
  return amt>0?twd/amt:0;
}
// 依日期取臺銀牌告：當天 → 最近較早的一天 → 最新牌告
const latestRateDate=()=>{ const m=String(S.rates.updatedAt||"").match(/(\d{4})\/(\d{2})\/(\d{2})/); return m?`${m[1]}-${m[2]}-${m[3]}`:today(); };
function ratesFor(date){
  const L=latestRateDate();
  if(!date||date>=L) return {rates:S.rates.rates,date:L,exact:true,latest:true};
  const H=S.rateHist||{};
  if(H[date]) return {rates:H[date].rates,date,exact:true};
  const prev=Object.keys(H).filter(d=>d<date).sort().pop();
  if(prev) return {rates:H[prev].rates,date:prev,exact:false};
  const first=Object.keys(H).sort()[0];
  if(first&&first<L) return {rates:H[first].rates,date:first,exact:false,after:true};
  return {rates:S.rates.rates,date:L,exact:false,after:true};
}
const mdT=d=>d?d.slice(5).replace("-","/"):"";
function quote(amount,cur,method,feePct,t,payer,date){
  const RF=ratesFor(date);
  const r=RF.rates[cur]||S.rates.rates[cur];
  let rate=1,label="新台幣",est=false;
  const isCard=method==="card"||method==="mobile";
  if(cur!=="TWD"){
    if(!r) return {rate:0,label:"無牌告",base:0,fee:0,total:0,est:true};
    if(!isCard){
      const own=payer?avgRate(payer,cur):0;
      if(own){rate=own;label=payer===KITTY?"公費換匯成本":"換匯成本";}
      else if(t?.cashRates?.[cur]){rate=t.cashRates[cur];label="自訂換匯匯率";}
      else if(r[1]){rate=r[1];label="臺銀現金賣出";}
      else {rate=r[3];label="臺銀即期賣出";}
    }else{
      if(r[3]){rate=r[3];label="臺銀即期賣出";}
      else {rate=(r[0]+r[1])/2;label="臺銀現金中價・估";est=true;}
    }
  }
  if(cur!=="TWD"&&label.startsWith("臺銀")&&!RF.latest) label+=`・${mdT(RF.date)}`;
  const base=amount*rate;
  const fee=(isCard&&cur!=="TWD")?base*(feePct||0)/100:0;
  return {rate,label,base,fee,total:base+fee,est,rateDate:RF.date,rateExact:RF.exact};
}
const finalTWD = e => (e.actualTWD!=null && e.actualTWD!=="") ? Number(e.actualTWD) : Number(e.twd||0);
function sharesOf(e,v){
  const sp=(e.split&&e.split.length)?e.split:[e.payer];
  const out={};
  if(e.splitMode==="unit"&&Array.isArray(e.groups)){
    const gs=e.groups.map(g=>(g||[]).filter(id=>sp.includes(id))).filter(g=>g.length);
    if(gs.length){ gs.forEach(g=>g.forEach(id=>out[id]=(out[id]||0)+v/gs.length/g.length)); return out; }
  }
  if(e.splitMode==="shares"||e.splitMode==="exact"){
    const w=sp.map(id=>Math.max(0,Number(e.weights?.[id]||0))); const sum=w.reduce((a,b)=>a+b,0);
    if(sum>0){ sp.forEach((id,i)=>out[id]=v*w[i]/sum); return out; }
  }
  sp.forEach(id=>out[id]=v/sp.length); return out;
}
function compute(t){
  const all=Object.values(S.entries);
  const exps=all.filter(e=>(e.kind||"expense")==="expense");
  const priv=Object.values(S.priv);
  const ids=[...(t.members||[]).map(m=>m.id),KITTY];
  const net={},paid={},share={}; ids.forEach(i=>{net[i]=0;paid[i]=0;share[i]=0});
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v};
  let kittyIn=0,kittySpent=0;
  for(const e of exps){
    const v=finalTWD(e); add(net,e.payer,v); add(paid,e.payer,v);
    if(e.payer===KITTY) kittySpent+=v;
    const sh=sharesOf(e,v); for(const id in sh){add(net,id,-sh[id]); add(share,id,sh[id]);}
  }
  const contrib={};
  for(const e of all.filter(e=>e.kind==="kitty_in")){ const v=Number(e.twd||0); add(net,e.member,v); add(net,KITTY,-v); add(contrib,e.member,v); kittyIn+=v; }
  const transfers=all.filter(e=>e.kind==="transfer");
  let kittyXfer=0;
  for(const e of transfers){ const v=Number(e.twd||0); add(net,e.from,v); add(net,e.to,-v); if(e.from===KITTY)kittyXfer-=v; if(e.to===KITTY)kittyXfer+=v; }
  // 現金錢包
  const wallet={};
  const wadd=(h,c,v)=>{ (wallet[h] ||= {}); (wallet[h][c] ||= {in:0,out:0}); if(v>0)wallet[h][c].in+=v; else wallet[h][c].out+=-v; };
  for(const e of all){
    if(e.kind==="exchange" && e.cur!=="TWD") wadd(e.member,e.cur,Number(e.amount));
    if(e.kind==="kitty_in" && e.cur!=="TWD"){ wadd(KITTY,e.cur,Number(e.amount)); if(avgRate(e.member,e.cur)) wadd(e.member,e.cur,-Number(e.amount)); }
  }
  for(const e of [...exps,...priv]) if((e.method==="cash"||e.method==="ic") && e.cur!=="TWD" && e.payer && e.payer!==KITTY) wadd(e.payer,e.cur,-Number(e.amount));
  // 公費現金（含台幣）
  const kittyCash={}; const kadd=(c,v)=>kittyCash[c]=(kittyCash[c]||0)+v;
  for(const e of all){
    if(e.kind==="kitty_in") kadd(e.cur,Number(e.amount));
    if(e.kind==="exchange"&&e.member===KITTY){ kadd(e.cur,Number(e.amount)); kadd("TWD",-Number(e.twd)); }
    if(e.kind==="transfer"){ if(e.from===KITTY) kadd("TWD",-Number(e.twd)); if(e.to===KITTY) kadd("TWD",Number(e.twd)); }
  }
  for(const e of exps) if(e.payer===KITTY){ if(e.method==="cash"||e.method==="ic") kadd(e.cur,-Number(e.amount)); else kadd("TWD",-finalTWD(e)); }
  const dups=dupFlags(all);
  const total=exps.reduce((a,e)=>a+finalTWD(e),0);
  const me=meId(t);
  const privTotal=priv.reduce((a,e)=>a+finalTWD(e),0);
  const myShare=me?(share[me]||0)+privTotal:0;
  const fees=exps.reduce((a,e)=>a+Number(e.fee||0),0)+priv.reduce((a,e)=>a+Number(e.fee||0),0);
  return {all,exps,priv,net,paid,share,contrib,kittyCash,dups,kittyBal:kittyIn-kittySpent+kittyXfer,transfers,wallet,kittyIn,kittySpent,total,me,myShare,privTotal,fees};
}
function dupFlags(list){
  const out=new Set(), last={};
  [...list].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(e=>{
    const k=[e.kind||"expense",e.member||e.payer||"",e.from||"",e.to||"",e.cur||"",e.amount||e.twd||"",e.title||"",e.date||""].join("|");
    const p=last[k]; if(p&&Math.abs((e.createdAt||0)-(p.createdAt||0))<180000) out.add(e.id); last[k]=e; });
  return out;
}

function dispRate(t){ if(!t||t.currency==="TWD") return 0; const r=S.rates.rates[t.currency]; return r?(r[3]||r[1]):0; }
const useLocal=t=>!!dispRate(t)&&(S.splitCur||"local")==="local";
const mT=(t,v)=>useLocal(t)?curT(v/dispRate(t),t.currency):ntdT(v);
const mH=(t,v)=>`<span class="num">${mT(t,v)}</span>`;

  const loc=t&&useLocal(t); const main=loc?curT(Math.abs(r)/dispRate(t),t.currency):Math.abs(r).toLocaleString("zh-TW");
  return `<div style="text-align:right;white-space:nowrap"><div class="num ${r>0?"pos":"neg"}">${r>0?"+":"−"}${main}</div>${loc?`<div class="tiny num">${ntdT(Math.abs(r))}</div>`:""}</div>`; };
function settlements(net){
  const cred=[],debt=[];
  Object.entries(net).forEach(([id,n])=>{n=Math.round(n); if(n>0)cred.push([id,n]); else if(n<0)debt.push([id,-n]);});
  cred.sort((a,b)=>b[1]-a[1]); debt.sort((a,b)=>b[1]-a[1]);
  const out=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const x=Math.min(debt[i][1],cred[j][1]);
    if(x>0) out.push([debt[i][0],cred[j][0],x]);
    debt[i][1]-=x; cred[j][1]-=x;
    if(debt[i][1]<=0)i++; if(cred[j][1]<=0)j++;
  }
  return out;
}

    else toast("儲存失敗，請稍後再試");
    throw e;
  }finally{ S.pending--; updStatus(); }
}
const Store = {
  async saveTrip(t){
    if(db){
      const prev=S.trips[t.id]||{}; const now=(t.members||[]).map(m=>m.uid).filter(Boolean);
      const removed=(prev.members||[]).map(m=>m.uid).filter(u=>u&&!now.includes(u)&&u!==t.ownerUid);
      t={...t,memberUids:[...new Set([...(prev.memberUids||t.memberUids||[]),...now,...(t.ownerUid?[t.ownerUid]:[])])].filter(u=>!removed.includes(u))};
      await guard(db.collection("trips").doc(t.id).set(t)); }
    else { local.trips[t.id]=t; lsave(); S.trips={...local.trips}; render(); }
  },
  async deleteTrip(id){
    if(db){
      for(const k of Object.keys(S.entries)) await guard(db.doc(`trips/${id}/expenses/${k}`).delete());
      for(const k of Object.keys(S.priv)) await guard(db.doc(`users/${S.uid}/private/${k}`).delete());
      await guard(db.collection("trips").doc(id).delete());
    }else{ delete local.trips[id]; delete local.expenses[id]; lsave(); S.trips={...local.trips}; render(); }
  },
  async save(tid,e){
    if(db){
      if(e.private){ await guard(db.doc(`users/${S.uid}/private/${e.id}`).set({...e,tripId:tid})); }
      else await guard(db.doc(`trips/${tid}/expenses/${e.id}`).set(e));
    }else{ (local.expenses[tid] ||= {})[e.id]=e; lsave(); localSplit(tid); render(); }
  },
  async del(tid,e){
    if(db){
      if(e.private) await guard(db.doc(`users/${S.uid}/private/${e.id}`).delete());
      else await guard(db.doc(`trips/${tid}/expenses/${e.id}`).delete());
    }else{ delete local.expenses[tid]?.[e.id]; lsave(); localSplit(tid); render(); }
  },
  watch(tid){
    if(unsubE){unsubE();unsubE=null} if(unsubP){unsubP();unsubP=null}
    S.entries={}; S.priv={};
    if(!db){ localSplit(tid); return; }
    unsubE=db.collection(`trips/${tid}/expenses`).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.entries=o; render(); checkEditing();
      resolveNames([...new Set(Object.values(o).map(e=>e.createdBy).filter(Boolean))]);
    },()=>{ const t=S.trips[tid]; if(t&&!needsClaim(t)) toast("明細讀取中斷"); });
    if(S.uid){
      unsubP=db.collection(`users/${S.uid}/private`).where("tripId","==",tid).onSnapshot(snap=>{
        const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.priv=o; render(); checkEditing();
      },()=>{});
    }
  },
  async saveReceipt(tid,e,data){
    if(db){ const p=e.private?`users/${S.uid}/private/r-${e.id}`:`trips/${tid}/receipts/${e.id}`; await guard(db.doc(p).set({data,createdAt:Date.now()})); }
    else{ (local.receipts ||= {})[e.id]=data; lsave(); }
  },
  async getReceipt(tid,e){
    try{ if(db){ const p=e.private?`users/${S.uid}/private/r-${e.id}`:`trips/${tid}/receipts/${e.id}`; const d=await db.doc(p).get(); return d.exists?d.data().data:null; }
      return (local.receipts||{})[e.id]||null; }catch(_){ return null; }
  },
  async delReceipt(tid,e){
    if(db){ const p=e.private?`users/${S.uid}/private/r-${e.id}`:`trips/${tid}/receipts/${e.id}`; await db.doc(p).delete(); }
    else{ delete (local.receipts||{})[e.id]; lsave(); }
  },
  unwatch(){ if(unsubE){unsubE();unsubE=null} if(unsubP){unsubP();unsubP=null} }
};

async function loadRates(){

  try{ const r=await fetch("rates-history.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok){ const v=await r.json(); if(v&&typeof v==="object") S.rateHist=v; } }catch(e){}

function startCloud(user){
  db=makeDB(); S.mode="cloud"; S.uid=user.uid; S.email=user.email||"";
  S.myName=user.displayName||"";
  db.doc(`users/${user.uid}/meta/profile`).get().then(d=>{ if(d.exists&&d.data().nickname){ S.myName=d.data().nickname; render(); } }).catch(()=>{});
  const timer=setTimeout(()=>{ if(!S.loaded){ S.note="雲端暫時連不上，先顯示這台手機上的資料"; render(); } },10000);
  if(unsubTrips) unsubTrips();
  unsubTrips=db.collection("trips").where("memberUids","array-contains",user.uid).onSnapshot(snap=>{
    clearTimeout(timer); S.loaded=true; S.note="";
    const o={}; snap.docs.forEach(x=>o[x.id]=x.data());
    if(S.tripId&&!o[S.tripId]&&S.trips[S.tripId]&&needsClaim(S.trips[S.tripId])) o[S.tripId]=S.trips[S.tripId]; // 尚未加入、正在選身分
    S.trips=o;

    render(); onHash();
  },e=>{ clearTimeout(timer); S.loaded=true; S.note="雲端讀取失敗"; console.warn(e); render(); });

}

async function signIn(){
  if(!FB){ toast("無法連線到登入服務，請確認網路"); return; }
  const p=new FB.A.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{ await FB.A.signInWithPopup(FB.auth,p); }
  catch(e){

    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") toast("登入失敗："+(e.code||"請稍後再試"));

  render();

function onHash(){
  const m=(location.hash||"").match(/^#trip-([a-z0-9]+)$/);
  if(m){
    if(S.tripId===m[1]) return;
    if(S.trips[m[1]]) openTrip(m[1],true);
    else if(S.mode==="cloud"&&S.loaded&&!S._joining){
      S._joining=m[1];
      db.doc(`trips/${m[1]}`).get().then(d=>{ S._joining=null;
        if(d.exists){ S.trips={...S.trips,[m[1]]:d.data()}; openTrip(m[1],true); }
        else { toast("找不到這個旅程，請確認連結是否正確"); setHash("trips"); } })
      .catch(()=>{ S._joining=null; toast("無法開啟這個旅程"); setHash("trips"); });
    }
    else if(S.mode==="local"&&S.loaded) { toast("請先登入，才能加入朋友的旅程"); }
  }else if((location.hash==="#trips"||!location.hash) && S.tripId){ goHome(true); }

function tripPhase(t){
  if(t.settled) return "已結清";
  const td=today(); if(!t.start) return "";
  if(td<t.start){ const n=nights(td,t.start); return n===1?"明天出發":`出發倒數 ${n} 天`; }
  if(!t.end||td<=t.end) return t.end?`第 ${nights(t.start,td)+1}/${nights(t.start,t.end)+1} 天`:`第 ${nights(t.start,td)+1} 天`;
  return "旅程結束・待結算";
}
function heroAmt(t,C){
  const c=t.currency, r=S.rates.rates[c];
  const tr=r?(r[3]||r[1]):0;
  if(c==="TWD"||!tr) return `<div class="v num"><small>NT$</small>${Math.round(C.total).toLocaleString("zh-TW")}</div>`;

/* --- 明細 --- */
function filterRows(t,rows){
  const f=S.filter||{};
  const q=(f.q||"").trim().toLowerCase();
  return rows.filter(e=>{
    if(q&&!((e.title||"").toLowerCase().includes(q)||catOf(t,e.cat).name.includes(q)||nameOf(t,e.payer).toLowerCase().includes(q))) return false;
    if(f.cat&&e.cat!==f.cat) return false;
    if(f.payer){ if(f.payer==="__priv"){ if(!e.private) return false; } else if(e.payer!==f.payer||e.private) return false; }
    if(f.method&&e.method!==f.method) return false;
    return true;
  });
}
function filterBar(t){
  const f=S.filter||{}; const n=["cat","payer","method"].filter(k=>f[k]).length;

    <button class="btn sm line" id="fbtn" style="${n?"border-color:var(--ink)":""}">篩選${n?` ${n}`:""}</button></div>
    <div class="fpanel" id="fpanel" style="display:${S.fOpen?"grid":"none"}">
      <select class="inp" id="fcat"><option value="">全部分類</option>${catsOf(t).map(c=>`<option value="${esc(c.id)}" ${f.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>

      <select class="inp" id="fmet"><option value="">全部方式</option>${Object.entries(METHODS).map(([k,n])=>`<option value="${k}" ${f.method===k?"selected":""}>${n}</option>`).join("")}</select>

}
function listTab(t,C){
  return listHead(t,C)+`<div id="listBody">${listBody(t,C)}</div>`;
}
function listHead(t,C){
  const rows=[...C.exps,...C.priv];

function listBody(t,C){

function listRows(t,C,rows){

        :`${e.payer===KITTY?"公費支付":esc(nameOf(t,e.payer))+" 付"}<span class="dot"></span>${e.splitMode==="unit"?(e.groups||[]).filter(g=>g.some(id=>(e.split||[]).includes(id))).length+" 組分":e.splitMode&&e.splitMode!=="equal"?"不均分":(e.split||[]).length+" 人分"}`;
      return `<div class="swipe">${RO()?"":`<div class="acts"><button class="ed" data-sed="${esc(e.id)}" data-p="${e.private?1:0}">${ic("edit")}編輯</button><button class="dl" data-sdl="${esc(e.id)}" data-p="${e.private?1:0}">${ic("trash")}刪除</button></div>`}<div class="exp" data-exp="${esc(e.id)}" data-p="${e.private?1:0}">
        <div class="ic">${ic(c.icon)}</div>
        <div class="grow"><div class="n">${esc(e.title||c.name)}</div>
          <div class="meta-line">${who}<span class="pill ${card?"w":""}">${METHODS[e.method]||"現金"}</span>${e.actualTWD!=null&&e.actualTWD!==""?'<span class="pill">已對帳</span>':""}${placePill(e)}${e.hasReceipt?'<span class="pill">收據</span>':""}${C.dups.has(e.id)?'<span class="pill w">可能重複</span>':""}</div></div>
        <div class="r">${e.cur!=="TWD"?`<b>${fmtCur(e.amount,e.cur)}</b><span class="tiny">${ntd(finalTWD(e))}</span>`:`<b>${ntd(finalTWD(e))}</b>`}</div>
      </div></div>`}).join("")}</div>`;
  }).join("");
}

/* --- 動態 --- */
function feedItems(t,onlyNew){
  if(!isCloud()||!S.uid) return [];
  const prev=onlyNew?(S.seenPrev[t.id]||0):0;
  const out=[];
  for(const e of Object.values(S.entries)){
    const kind=e.kind||"expense";
    const label=kind==="expense"?`${esc(e.title||catOf(t,e.cat).name)}　<span class="num">${e.cur!=="TWD"?curT(e.amount,e.cur):ntdT(finalTWD(e))}</span>`:kind==="exchange"?`換匯 <span class="num">${curT(e.amount,e.cur)}</span>`:kind==="kitty_in"?`繳交公費 <span class="num">${ntdT(e.twd)}</span>`:`轉帳給 ${esc(nameOf(t,e.toP||e.to))} <span class="num">${ntdT(e.twd)}</span>`;
    if(e.createdBy&&e.createdBy!==S.uid&&(e.createdAt||0)>prev) out.push({ts:e.createdAt,who:e.createdBy,txt:(kind==="transfer"?"記錄":"新增")+"了 "+label});
    if(e.updatedBy&&e.updatedBy!==S.uid&&e.updatedAt&&e.updatedAt-(e.createdAt||0)>60000&&e.updatedAt>prev) out.push({ts:e.updatedAt,who:e.updatedBy,txt:"修改了 "+label});
    if(kind==="transfer"&&e.confirmed&&e.confirmedBy&&e.confirmedBy!==S.uid&&(e.confirmedAt||0)>prev) out.push({ts:e.confirmedAt,who:e.confirmedBy,txt:`確認收到 <span class="num">${ntdT(e.twd)}</span>`});
  }
  return out.sort((a,b)=>b.ts-a.ts);
}
function feedCard(t){
  if(S.feedHidden[t.id]) return "";
  const it=feedItems(t,true); if(!it.length) return "";
  return `<div class="feed"><div class="row"><b class="grow" style="font-size:14px">上次查看後有 ${it.length} 則更新</b><button class="lnk" id="feedAll">全部動態</button><button class="iconbtn" style="width:36px;height:36px;border:none" id="feedX" aria-label="關閉">${ic("x")}</button></div>
    ${it.slice(0,4).map(f=>`<div class="it"><span class="av" style="background:${colorOf(t,(t.members||[]).find(m=>m.uid===f.who)?.id)}">${esc(recorderName(t,f.who).slice(0,1))}</span><div class="grow"><b>${esc(recorderName(t,f.who))}</b> ${f.txt}<div class="tiny">${timeT(f.ts)}</div></div></div>`).join("")}</div>`;
}
function feedSheet(t){
  const it=feedItems(t,false).slice(0,60);
  openSheet(`<h3>動態</h3>${it.length?`<div class="sec tight">${it.map(f=>`<div class="prow"><span class="av" style="background:${colorOf(t,(t.members||[]).find(m=>m.uid===f.who)?.id)}">${esc(recorderName(t,f.who).slice(0,1))}</span><div class="grow" style="font-size:14px;line-height:1.5"><b>${esc(recorderName(t,f.who))}</b> ${f.txt}<div class="tiny">${timeT(f.ts)}</div></div></div>`).join("")}</div>`:`<div class="empty" style="padding:30px 0">旅伴的新增與修改會顯示在這裡</div>`}

  const fsum=fc!=="TWD"&&tr?ex.reduce((a,e)=>a+(e.cur===fc?Number(e.amount):finalTWD(e)/tr),0):null;

  const byDay={}; ex.forEach(e=>byDay[e.date]=(byDay[e.date]||0)+finalTWD(e));

  const topOne=[...ex].sort((a,b)=>finalTWD(b)-finalTWD(a))[0];
  const byCat={}; ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+finalTWD(e));

async function importBackup(data,opts={}){
  if(!data||data.app!=="tripsplit"||!data.trip||!Array.isArray(data.entries)){ toast("這不是旅帳的備份檔"); return false; }
  const src=data.trip;
  if(!opts.silent){
    const n=data.entries.filter(e=>(e.kind||"expense")==="expense").length+(data.priv||[]).length;
    if(!await confirmBox(`匯入「${src.name}」？將建立成一個新的旅程（${(src.members||[]).length} 位旅伴、${n} 筆花費），不會影響現有旅程。`,"匯入",false)) return false;
  }
  const nt={...src,id:uid(),name:opts.keepName?src.name:`${src.name}（還原）`,ownerUid:S.uid||null,settled:false,settledAt:null,cacheTotal:src.cacheTotal||0,
    members:(src.members||[]).map(m=>{ const o={id:m.id,name:m.name}; if(m.uid&&m.uid===S.uid) o.uid=m.uid; return o; })};
  if(isCloud()&&S.uid&&!nt.members.some(m=>m.uid===S.uid)&&nt.members.length&&opts.claimFirst) nt.members[0].uid=S.uid;
  try{
    await Store.saveTrip(nt);
    for(const e of data.entries){ const c={...e}; delete c.tripId; await Store.save(nt.id,{...c,hasReceipt:false}); }
    for(const e of (data.priv||[])){ await Store.save(nt.id,{...e,id:uid(),private:true,hasReceipt:false}); }
    if(!opts.silent){ toast("已匯入"); openTrip(nt.id); }
    return true;
  }catch(e){ toast("匯入未完成，請稍後再試"); return false; }
}

function settleText(t,C){
  const PN=partyNet(t,C,splitView(t)); const s=settlements(PN.net);
  const loc=useLocal(t); const w=v=>loc?`${mT(t,v)}（${ntdT(v)}）`:ntdT(v);
  let txt=`【${t.name}】旅費結算\n共同花費 ${w(C.total)}\n\n`;
  if(splitView(t)==="unit") PN.parties.forEach(u=>{const pd=u.members.reduce((a,id)=>a+(C.paid[id]||0)+(C.contrib[id]||0),0), sh=u.members.reduce((a,id)=>a+(C.share[id]||0),0); txt+=`${nameOf(t,u.id)}｜已付 ${mT(t,pd)}　應分攤 ${mT(t,sh)}\n`});
  else (t.members||[]).forEach(m=>{txt+=`${m.name}｜已付 ${mT(t,(C.paid[m.id]||0)+(C.contrib[m.id]||0))}　應分攤 ${mT(t,C.share[m.id]||0)}\n`});
  if(t.kitty?.enabled) txt+=`公費｜收 ${mT(t,C.kittyIn)}　支出 ${mT(t,C.kittySpent)}　結餘 ${mT(t,C.kittyBal)}\n`;
  const done=C.transfers;
  if(done.length) txt+="\n已完成轉帳\n"+done.map(e=>`${nameOf(t,e.fromP||e.from)} → ${nameOf(t,e.toP||e.to)}　${w(e.twd)}${e.confirmed?"（已確認）":"（待確認）"}`).join("\n")+"\n";
  txt+="\n尚需轉帳\n"+(s.length?s.map(([a,b,x])=>`${nameOf(t,a)} → ${nameOf(t,b)}　${w(x)}`).join("\n"):"無，款項已結清");
  txt+=`\n\n匯率依據：臺灣銀行牌告 ${S.rates.updatedAt}${loc?`（${t.currency} 以即期賣出 ${rateFmt(dispRate(t))} 換算）`:""}；刷卡金額含國外交易手續費。`;
  return txt;
}

  const s=settlements(PN.net);
  const me=C.me;
  const myUid=id=>(t.members||[]).find(m=>m.id===id)?.uid===S.uid;
  const canConfirm=e=>{ if(RO()) return false; if(!isCloud()||!S.uid) return true;
    const to=e.toP||e.to; if(to===KITTY) return myUid(t.kitty?.keeper); const u=findUnit(t,to); return u?u.members.some(myUid):myUid(to); };
  const units=unitsOf(t);
  const unitRows=view==="unit"?PN.parties.map(u=>{const n=PN.net[u.id]||0; const pd=u.members.reduce((a,id)=>a+(C.paid[id]||0),0), ct=u.members.reduce((a,id)=>a+(C.contrib[id]||0),0), sh=u.members.reduce((a,id)=>a+(C.share[id]||0),0);
      return `<div class="prow">${av(t,u.id)}<div class="grow"><div>${esc(nameOf(t,u.id))}${u.members.includes(me)?'<span class="tiny">（我）</span>':""}</div><div class="tiny">付了 ${mH(t,pd+ct)}${ct?`（含公費 ${mH(t,ct)}）`:""}<br>應付 ${mH(t,sh)}</div></div>
      ${netTag(n,t)}</div>`}).join(""):null;
  const cardTodo=C.exps.filter(e=>(e.method==="card"||e.method==="mobile")&&e.cur!=="TWD"&&(e.actualTWD==null||e.actualTWD===""));
  return `${units?`<div class="seg s2 flat" id="svw" style="margin-top:14px"><button data-sv="unit" class="${view==="unit"?"on":""}">以組結算</button><button data-sv="person" class="${view==="person"?"on":""}">以個人結算</button></div>`:""}
  <div class="eyebrow"><span>收支</span>${dispRate(t)?`<span class="seg s2 flat" style="width:auto;letter-spacing:0;text-transform:none;font-family:'Noto Sans TC'">${[["local",`${SYM[t.currency]||""} ${t.currency}`],["twd","NT$ 台幣"]].map(([k,l])=>`<button data-sc="${k}" class="${(S.splitCur||"local")===k?"on":""}" style="min-height:36px;padding:6px 12px;font-size:12.5px;font-family:var(--num);font-weight:600">${l}</button>`).join("")}</span>`:""}</div><div class="sec tight">
    ${unitRows!==null?unitRows:(t.members||[]).map(m=>{const n=C.net[m.id]||0;
      return `<div class="prow">${av(t,m.id)}<div class="grow"><div>${esc(m.name)}${m.id===me?'<span class="tiny">（我）</span>':""}</div><div class="tiny">付了 ${mH(t,(C.paid[m.id]||0)+(C.contrib[m.id]||0))}${C.contrib[m.id]?`（含公費 ${mH(t,C.contrib[m.id])}）`:""}<br>應付 ${mH(t,C.share[m.id]||0)}</div></div>
      ${netTag(n,t)}</div>`}).join("")}
    ${t.kitty?.enabled?`<div class="prow">${av(t,KITTY)}<div class="grow"><div>公費</div><div class="tiny">保管人 ${esc(nameOf(t,t.kitty.keeper))}　結餘 ${mH(t,C.kittyBal)}</div></div>${netTag(C.net[KITTY],t)}</div>`:""}
  </div>
  <div class="eyebrow">結算建議</div><div class="sec">
    <div class="sec-d" style="margin-bottom:4px">照這樣轉帳次數最少。付完按「已付款」，對方確認就完成。</div>
    ${!t.settled&&!s.length&&C.exps.length&&C.transfers.every(e=>e.confirmed)?`<div class="note g" style="margin-top:6px">所有款項都已結清。${isOwnerOf(t)?"封存後旅程會鎖定成唯讀，避免誤改；之後仍可重新開啟。":"等待旅程建立者封存旅程。"}</div>${isOwnerOf(t)&&!S.readOnly?`<button class="btn" id="archive" style="margin-top:12px">${ic("check")}封存旅程</button>`:""}`:""}
    ${s.length?s.map(([a,b,x])=>`<div style="padding:14px 0;border-bottom:1px solid var(--line2)">
      <div class="row" style="gap:8px;flex-wrap:wrap">${av(t,a)}<span>${esc(nameOf(t,a))}</span><span class="arrow">→</span>${av(t,b)}<span>${esc(nameOf(t,b))}</span></div>
      <div class="row" style="margin-top:10px"><div class="grow"><b class="num" style="font-size:19px;font-weight:600">${mT(t,x)}</b>${useLocal(t)?`<span class="tiny num">　${ntdT(x)}</span>`:""}</div>
      ${RO()?"":`<button class="btn xs line" data-pay="${esc(a)}|${esc(b)}|${x}">已付款</button>`}</div></div>`).join(""):`<div class="muted" style="padding:10px 0">款項已結清，無需轉帳</div>`}
  </div>
  ${C.transfers.length?`<div class="eyebrow">轉帳紀錄</div><div class="sec tight">
    ${C.transfers.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(e=>`<div class="prow">${av(t,e.fromP||e.from)}<span>${esc(nameOf(t,e.fromP||e.from))}</span><span class="arrow">→</span><span class="grow">${esc(nameOf(t,e.toP||e.to))}</span>
      <div style="text-align:right"><b>${mH(t,e.twd)}</b><div class="tiny">${useLocal(t)?ntdT(e.twd)+"・":""}${e.confirmed?`<span style="color:var(--ok)">已確認</span>`:"待收款人確認"}</div></div>
      ${!e.confirmed&&canConfirm(e)?`<button class="btn xs" data-confirm="${esc(e.id)}">確認收到</button>`:""}
      ${!RO()&&!e.confirmed?`<button class="iconbtn" style="width:40px;height:40px" data-undo="${esc(e.id)}">${ic("x")}</button>`:""}</div>`).join("")}
  </div>`:""}
  <div class="btnrow" style="margin-top:4px"><button class="btn line" id="imgSettle">${ic("image")}結算圖卡</button><button class="btn line" id="copySettle">${ic("copy")}複製文字</button></div>
  ${cardTodo.length?`<div class="tiny" style="margin-top:12px">有 ${cardTodo.length} 筆刷卡是預估金額，收到帳單後可到「統計 › 信用卡對帳」更新。</div>`:`<div class="note g">${useLocal(t)?`金額以臺銀即期賣出 ${rateFmt(dispRate(t))} 換算成${CUR[t.currency]||t.currency}顯示，下方灰字為台幣。可用當地現金或等值台幣轉帳；`:""}刷卡手續費已併入分攤。</div>`}`;
}

/* --- 錢包 --- */
function walletTab(t,C){
  const me=C.me;
  const holders=[...new Set([me,...Object.keys(C.wallet).filter(h=>h!==KITTY&&Object.values(C.wallet[h]||{}).some(w=>w.in>0))].filter(Boolean))];
  const card=(h,c,w)=>{
    const left=w.in-w.out, pct=w.in?Math.max(0,left)/w.in*100:0, ar=avgRate(h,c);
    return `<div class="wcard"><div class="row"><span class="num" style="font-weight:600">${c}</span><span class="tiny grow">${CUR[c]||""}</span>${ar?`<span class="tiny num">成本 ${rateFmt(ar)}</span>`:""}</div>
      ${w.in===0?`<div class="tiny" style="margin-top:6px">已用 ${curT(w.out,c)}。記下換匯金額，就能看到還剩多少。</div></div>`:`<div class="big num" style="margin-top:6px;${left<0?"color:var(--red)":""}">${curT(left,c)}</div>
      <div class="meter ${pct<15?"low":""}"><i style="width:${pct}%"></i></div>
      <div class="wline"><span>換入 ${curT(w.in,c)}</span><span>已用 ${curT(w.out,c)}</span></div>
      ${left<0?`<div class="tiny" style="color:var(--red);margin-top:6px">支出超過換匯紀錄，可能有漏記的換匯</div>`:pct<15&&w.in?`<div class="tiny" style="color:var(--warm);margin-top:6px">剩餘不到 15%，可考慮再換匯或改用刷卡</div>`:""}
    </div>`}`;
  };
  const block=h=>{
    const w=C.wallet[h]||{}; const curs=Object.keys(w);
    return `<div class="wwho">${av(t,h)}${esc(nameOf(t,h))}${h===me?'<span class="tiny">（我）</span>':""}</div>
      ${curs.length?curs.map(c=>card(h,c,w[c])).join(""):`<div class="tiny" style="margin:-2px 0 14px">尚無換匯紀錄</div>`}`;
  };
  const k=t.kitty||{};
  const kitIns=C.all.filter(e=>e.kind==="kitty_in");
  const kitBy={}; kitIns.forEach(e=>{ const o=(kitBy[e.member] ||= {twd:0,n:0,cur:{}}); o.twd+=Number(e.twd||0); o.n++; o.cur[e.cur]=(o.cur[e.cur]||0)+Number(e.amount); });
  const paidN=(t.members||[]).filter(m=>kitBy[m.id]).length;
  const exchList=C.all.filter(e=>e.kind==="exchange"&&e.member!==KITTY).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const ps=kittyMain(t,C);
  const ratio=C.kittyIn?C.kittyBal/C.kittyIn:0;
  // 公費收支明細
  const led=[];
  kitIns.forEach(e=>led.push({e,ts:e.createdAt||0,dir:"in",who:e.member,title:`${nameOf(t,e.member)} 繳交`,a:e.cur!=="TWD"?curT(e.amount,e.cur):ntdT(e.twd),sub:e.cur!=="TWD"?ntdT(e.twd):"",attr:`data-rec="${esc(e.id)}"`}));
  C.all.filter(e=>e.kind==="exchange"&&e.member===KITTY).forEach(e=>led.push({e,ts:e.createdAt||0,dir:"ex",who:KITTY,title:"公費換匯",a:`+${curT(e.amount,e.cur)}`,sub:`−${ntdT(e.twd)}`,attr:`data-rec="${esc(e.id)}"`}));
  C.exps.filter(e=>e.payer===KITTY).forEach(e=>led.push({e,ts:e.createdAt||0,dir:"out",who:KITTY,title:e.title||catOf(t,e.cat).name,a:`−${e.cur!=="TWD"?curT(e.amount,e.cur):ntdT(finalTWD(e))}`,sub:e.cur!=="TWD"?ntdT(finalTWD(e)):"",attr:`data-exp="${esc(e.id)}" data-p="0"`,icon:catOf(t,e.cat).icon}));
  C.transfers.filter(e=>e.from===KITTY||e.to===KITTY).forEach(e=>led.push({e,ts:e.createdAt||0,dir:e.from===KITTY?"out":"in",who:e.from===KITTY?(e.toP||e.to):(e.fromP||e.from),title:e.from===KITTY?`退還給 ${nameOf(t,e.toP||e.to)}`:`${nameOf(t,e.fromP||e.from)} 補繳`,a:`${e.from===KITTY?"−":"+"}${ntdT(e.twd)}`,sub:e.confirmed?"已確認":"待確認",attr:""}));
  led.sort((x,y)=>y.ts-x.ts);
  const ledRow=r=>`<div class="krow" ${r.attr} style="${r.attr?"cursor:pointer":""}">${r.dir==="out"&&r.icon?`<span class="ic sm">${ic(r.icon)}</span>`:av(t,r.who)}
    <div class="grow"><div style="font-size:14px">${esc(r.title)}${C.dups.has(r.e.id)?'<span class="pill w" style="margin-left:6px">可能重複</span>':""}</div><div class="tiny num">${esc((r.e.date||"").slice(5).replace("-","/"))}　${timeT(r.ts).split(" ")[1]||""}</div></div>
    <div class="amt"><b class="num ${r.dir==="in"?"kin":"kout"}">${r.dir==="in"&&!r.a.startsWith("+")?"+":""}${r.a}</b>${r.sub?`<span class="tiny num">${r.sub}</span>`:""}</div></div>`;
  return `
  <div class="eyebrow" id="kittySec">公費</div>
  ${k.enabled?`<div class="sec">
      <div class="row"><div class="grow"><div class="tiny">公費餘額</div>
        <div class="kbig num">${ps.length?ps.map(p=>`<span style="${p.v<0?"color:var(--red)":""}">${curT(p.v,p.c)}</span>`).join('<span class="tiny">　＋　</span>'):"—"}</div>
        ${ps.length&&!(ps.length===1&&ps[0].c==="TWD")?`<div class="tiny num">價值約 ${ntdT(C.kittyBal)}</div>`:""}</div>
        <div style="text-align:right"><div class="tiny">保管人</div><div class="row" style="gap:6px;margin-top:4px;justify-content:flex-end">${av(t,k.keeper)}<b style="font-weight:500">${esc(nameOf(t,k.keeper))}</b></div></div></div>
      ${C.kittyIn?`<div class="meter ${ratio<.15?"low":""}" style="margin-top:14px"><i style="width:${Math.max(0,Math.min(100,ratio*100))}%"></i></div>
      <div class="wline"><span>已收 ${ntdT(C.kittyIn)}</span><span>已支出 ${ntdT(C.kittySpent)}</span></div>`:`<div class="tiny" style="margin-top:10px">還沒有人繳交公費</div>`}
      <div class="row" style="margin-top:18px"><b class="grow" style="font-size:13.5px">繳交狀況</b><span class="tiny">${paidN} / ${(t.members||[]).length} 人已繳</span></div>
      <div>${(t.members||[]).map(m=>{const o=kitBy[m.id]; return `<div class="krow">${av(t,m.id)}<span class="grow">${esc(m.name)}</span>
        ${o?`<div class="amt"><b class="num">${Object.entries(o.cur).map(([c,v])=>curT(v,c)).join("、")}</b><span class="tiny num">${Object.keys(o.cur).some(c=>c!=="TWD")?ntdT(o.twd)+"・":""}${o.n} 筆</span></div>`:`<span class="tiny">尚未繳交</span>`}</div>`}).join("")}</div>
      ${RO()?"":`<div class="btnrow" style="margin-top:14px"><button class="btn sm" id="kitIn" style="width:100%">${ic("plus")}繳交公費</button><button class="btn sm line" id="kitEx" style="width:100%">${ic("swap")}公費換匯</button></div>`}
      <div class="tiny" style="margin-top:12px">付款人選「公費」就會從這裡扣，結算時多退少補。</div>
    </div>
    ${led.length?`<div class="eyebrow">公費收支</div><div class="sec tight">${led.map(ledRow).join("")}</div>`:""}`:`<div class="sec"><div class="row"><span class="ic sm">${ic("kitty")}</span><div class="grow"><div style="font-weight:700">公費</div><div class="tiny">大家先繳一筆，共同開銷從這裡付</div></div>${RO()?"":`<button class="btn sm line" id="kitOn">啟用</button>`}</div></div>`}
  <div class="eyebrow">外幣現金 ${RO()?"":`<button class="lnk" id="addExch">＋ 換匯紀錄</button>`}</div>
  <div class="sec">
    <div class="sec-d">記下換了多少外幣，現金花費會自動扣除，也會用你的實際匯率算台幣。</div>
    ${holders.length?holders.map(block).join(""):`<div class="tiny">尚無換匯紀錄</div>`}
  </div>
  ${exchList.length?`<div class="eyebrow">換匯紀錄</div><div class="sec tight">${exchList.map(e=>`<div class="recrow" data-rec="${esc(e.id)}">${av(t,e.member)}<div class="grow"><div>${esc(nameOf(t,e.member))}　${fmtCur(e.amount,e.cur)}${C.dups.has(e.id)?'<span class="pill w" style="margin-left:6px">可能重複</span>':""}</div><div class="tiny num">${esc(e.date||"")}　匯率 ${rateFmt(e.twd/e.amount)}</div></div><b>${ntd(e.twd)}</b></div>`).join("")}</div>`:""}
`;
}

/* --- 統計 --- */
function statTab(t,C){
  if(!C.exps.length&&!C.priv.length) return `<div class="empty"><div class="t">尚無統計</div>新增幾筆紀錄後即會顯示</div>`;
  const total=C.total||1;
  const byCat={},byM={};
  C.exps.forEach(e=>{const v=finalTWD(e);byCat[e.cat]=(byCat[e.cat]||0)+v;byM[e.method]=(byM[e.method]||0)+v;});
  const row=(icon,name,v,tot)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line2)"><div class="row">${icon}<span class="grow">${esc(name)}</span><b class="num" style="font-weight:600">${ntdT(v)}</b><span class="tiny num" style="width:38px;text-align:right">${(v/tot*100).toFixed(0)}%</span></div><div class="statbar"><i style="width:${v/tot*100}%"></i></div></div>`;
  const cards=[...C.exps,...C.priv].filter(e=>(e.method==="card"||e.method==="mobile")&&e.cur!=="TWD");
  const done=cards.filter(e=>e.actualTWD!=null&&e.actualTWD!=="").length;
  let mine="";
  if(C.me){
    const mc={}; C.exps.forEach(e=>{const s=sharesOf(e,finalTWD(e))[C.me]||0; if(s) mc[e.cat]=(mc[e.cat]||0)+s;}); C.priv.forEach(e=>mc[e.cat]=(mc[e.cat]||0)+finalTWD(e));
    const mt=C.myShare||1;
    mine=`<div class="eyebrow">我的花費</div><div class="sec tight">${Object.entries(mc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const c=catOf(t,k);return row(`<span class="ic sm">${ic(c.icon)}</span>`,c.name,v,mt)}).join("")}
      ${C.privTotal?`<div class="tiny" style="padding:10px 0">含私人花費 ${ntdT(C.privTotal)}，僅你本人可見</div>`:""}</div>`;
  }
  const dN=Math.max(1,(t.start&&t.end)?nights(t.start,t.end)+1:new Set(C.exps.map(e=>e.date)).size||1);
  return `<div class="rv" style="margin-top:16px">
    <div class="c"><div class="k">全團日均</div><div class="v num">${ntdT(C.total/dN)}</div></div>
    <div class="c"><div class="k">每人平均</div><div class="v num">${ntdT(C.total/Math.max(1,(t.members||[]).length))}</div></div>
    <div class="c"><div class="k">刷卡手續費</div><div class="v num">${ntdT(C.fees)}</div></div>
    <div class="c"><div class="k">紀錄筆數</div><div class="v num">${C.exps.length+C.priv.length}</div></div></div>
  <button class="btn line" id="reviewBtn" style="margin-top:10px">${ic("spark")}旅程回顧</button>
  <div class="eyebrow">信用卡對帳</div><div class="sec"><div class="row"><div class="grow"><div class="sec-t" style="margin:0">信用卡對帳</div><div class="tiny">${cards.length?`已對帳 ${done} / ${cards.length} 筆`:"尚無刷卡紀錄"}</div></div>${cards.length?`<button class="btn sm line" id="recon">開始對帳</button>`:""}</div>
    ${C.fees?`<div class="tiny" style="margin-top:10px">這趟刷卡手續費約 ${ntdT(C.fees)}，用海外免手續費的卡可以省下。</div>`:""}</div>
  ${mine}
  <div class="eyebrow">全團・分類</div><div class="sec tight">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const c=catOf(t,k);return row(`<span class="ic sm">${ic(c.icon)}</span>`,c.name,v,total)}).join("")||'<div class="tiny" style="padding:12px 0">尚無共同花費</div>'}</div>
  <div class="eyebrow">全團・付款方式</div><div class="sec tight">${Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([k,v])=>row(`<span class="ic sm">${ic(k)}</span>`,METHODS[k]||"現金",v,total)).join("")||'<div class="tiny" style="padding:12px 0">尚無共同花費</div>'}</div>
  <div class="eyebrow">全團・每人負擔</div><div class="sec tight">${(t.members||[]).map(m=>row(av(t,m.id),m.name,C.share[m.id]||0,total)).join("")}</div>
  <button class="btn line" id="exportX" style="margin-top:4px">${ic("download")}匯出 Excel</button>`;
}

    ${RO()?"":`<div class="tiny" style="margin-top:8px">點旅伴的名字可以改顯示名稱</div>`}

function bindSwipe(t){
  $$(".swipe .exp").forEach(el=>{
    if(!el.parentElement.querySelector(".acts")) return;
    let x0=null,y0=0,dx=0,lock=null;
    el.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"&&e.button!==0) return; x0=e.clientX;y0=e.clientY;dx=0;lock=null; el.style.transition="none"; });
    el.addEventListener("pointermove",e=>{ if(x0==null) return; const mx=e.clientX-x0, my=e.clientY-y0;
      if(lock==null&&(Math.abs(mx)>8||Math.abs(my)>8)) lock=Math.abs(mx)>Math.abs(my)?"x":"y";
      if(lock!=="x") return; const base=el.dataset.swiped==="1"?-144:0; dx=Math.min(0,Math.max(-170,base+mx)); el.style.transform=`translateX(${dx}px)`; });
    const end=()=>{ if(x0==null) return; el.style.transition=""; if(lock==="x"){ const open=dx<-60; el.style.transform=open?"translateX(-144px)":""; setTimeout(()=>{el.dataset.swiped=open?"1":""},0);
        $$(".swipe .exp").forEach(o=>{ if(o!==el&&o.dataset.swiped==="1"){o.style.transform="";o.dataset.swiped="";} }); }
      x0=null; };
    el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
    el.addEventListener("click",e=>{ if(lock==="x"){ e.stopImmediatePropagation(); lock=null; } },true);
  });
}

  openSheet(`<h3>${old?"編輯分組":"新增一組"}</h3>

  openSheet(`<h3>${old?"編輯換匯紀錄":"新增換匯紀錄"}</h3>
    <label class="l" style="margin-top:0">誰換的</label><select class="inp" id="xm">${holders.map(([id,n])=>`<option value="${esc(id)}" ${id===st.member?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <label class="l">換到的外幣</label>
    <div class="row"><select class="cursel" id="xc">${Object.keys(CUR).filter(c=>c!=="TWD"&&S.rates.rates[c]).map(c=>`<option ${c===st.cur?"selected":""}>${c}</option>`).join("")}</select><input class="inp grow num" id="xa" inputmode="decimal" placeholder="外幣金額" value="${esc(st.amount)}"></div>

    <div class="tiny" id="xrate" style="margin-top:8px"></div>

    ${RO()?"":`<button class="btn" id="xsave" style="margin-top:20px">${old?"更新":"儲存"}</button>`}
    ${old&&!RO()?`<button class="btn danger" id="xdel" style="margin-top:10px">刪除</button>`:""}`);
  let twdTouched=!!old;
  const draw=()=>{
    const a=parseNum($("#xa").value), c=$("#xc").value, r=ratesFor($("#xd").value).rates[c]||S.rates.rates[c];

    try{await Store.save(t.id,e); closeSheet(); toast("已記錄換匯")}catch(_){}
  }));

/* 繳交公費 */
function kitInSheet(t,old){
  // 預設以旅程當地貨幣繳交（例如去日本就是日圓），也可切換台幣或其他幣別
  const st=old?{...old}:{member:meId(t)||t.members[0].id,cur:t.currency,amount:"",date:today()};
  const quick=[t.currency,...(t.currencies||[]),"TWD"].filter((c,i,a)=>a.indexOf(c)===i&&(c==="TWD"||S.rates.rates[c]));
  const curs=[...quick,...Object.keys(CUR).filter(c=>!quick.includes(c)&&S.rates.rates[c])];
  openSheet(`<h3>${old?"編輯公費紀錄":"繳交公費"}</h3>
    <label class="l" style="margin-top:0">繳交人</label><select class="inp" id="km">${t.members.map(m=>`<option value="${esc(m.id)}" ${m.id===st.member?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
    <label class="l">金額</label>
    ${quick.length>1?`<div class="curchips" id="kchips">${quick.map(c=>`<button class="chip ${c===st.cur?"on":""}" data-kq="${c}">${SYM[c]||""} ${c}</button>`).join("")}</div>`:""}
    <div class="row"><select class="cursel" id="kc">${curs.map(c=>`<option ${c===st.cur?"selected":""}>${c}</option>`).join("")}</select><input class="inp grow num" id="ka" inputmode="decimal" placeholder="0" value="${esc(st.amount)}"></div>
    <div class="tiny" id="kconv" style="margin-top:8px"></div>
    ${old?"":`<button class="lnk" id="kall" style="margin-top:12px">全員各繳相同金額</button>`}
    <label class="l">日期</label><input class="inp num" type="date" id="kd" value="${esc(st.date)}">
    ${RO()?"":`<button class="btn" id="ksave" style="margin-top:20px">${old?"更新":"儲存"}</button>`}
    ${old&&!RO()?`<button class="btn danger" id="kdel" style="margin-top:10px">刪除</button>`:""}`);
  let all=false;
  const val=()=>{const a=parseNum($("#ka").value),c=$("#kc").value,m=$("#km").value; if(c==="TWD")return{a,tw:a,rate:1}; const RR=ratesFor($("#kd").value).rates[c]||S.rates.rates[c]; const r=avgRate(m,c)||RR?.[1]||RR?.[3]||0; return{a,tw:a*r,rate:r};};
  const draw=()=>{const v=val(); $("#kconv").innerHTML=($("#kc").value!=="TWD"&&v.a?`約合 ${ntd(v.tw)}　匯率 <span class="num">${rateFmt(v.rate)}</span>`:"")+(all?`<div style="color:var(--pri);margin-top:4px">將為 ${t.members.length} 位旅伴各記一筆</div>`:"");};
  const syncChips=()=>$$("#kchips [data-kq]").forEach(b=>b.classList.toggle("on",b.dataset.kq===$("#kc").value));
  $$("#kchips [data-kq]").forEach(b=>b.onclick=()=>{ $("#kc").value=b.dataset.kq; syncChips(); draw(); });
  $("#ka").oninput=draw; $("#kc").onchange=()=>{syncChips();draw()}; $("#km").onchange=draw; $("#kd").onchange=draw; draw();
  if(!old) setTimeout(()=>$("#ka")?.focus(),250);
  $("#kall")&&($("#kall").onclick=()=>{all=!all;$("#kall").textContent=all?"改為只記一人":"全員各繳相同金額";$("#km").disabled=all;draw()});
  $("#ksave")&&($("#ksave").onclick=lock(async()=>{
    const v=val(); if(v.a<=0){toast("請輸入金額");return}
    if(!await conflictOK(t,old)){ const cur=liveOf(old); if(cur) kitInSheet(t,cur); return; }
    const list=all?t.members.map(m=>m.id):[$("#km").value];
    try{

async function exportXlsx(t){

    const splitDesc=e=>{const sh=sharesOf(e,finalTWD(e));return Object.entries(sh).map(([id,v])=>`${nameOf(t,id)} ${Math.round(v)}`).join("、")};
    const rows=[["日期","項目","分類","付款方式","幣別","金額","匯率","匯率依據","預估台幣","手續費","實際入帳","採用台幣","付款人","分攤明細","私人","記帳人","地點連結"]];
    [...C.exps,...C.priv].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>{

      rows.push([e.date,e.title||c.name,c.name,METHODS[e.method]||"現金",e.cur,e.amount,e.rate,e.rateLabel||"",e.twd,e.fee||0,e.actualTWD??"",r2(finalTWD(e)),e.private?"我":nameOf(t,e.payer),e.private?"":splitDesc(e),e.private?"是":"",recorderName(t,e.createdBy),e.place||""]);
    });
    const s=settlements(C.net);
    const sum=[["旅程",t.name],["目的地",`${t.country}（${t.currency}）`],["日期",`${t.start||""} ~ ${t.end||""}`],["共同花費",Math.round(C.total)],["匯率依據",`臺灣銀行牌告 ${S.rates.updatedAt}`],[],["旅伴","已付","應分攤","差額"]];
    (t.members||[]).forEach(m=>sum.push([m.name,Math.round(C.paid[m.id]||0),Math.round(C.share[m.id]||0),Math.round(C.net[m.id]||0)]));
    if(t.kitty?.enabled) sum.push([],["公費已收",Math.round(C.kittyIn)],["公費支出",Math.round(C.kittySpent)],["公費結餘",Math.round(C.kittyBal)]);
    sum.push([],["尚需轉帳","收款人","金額"]); s.forEach(([a,b2,x])=>sum.push([nameOf(t,a),nameOf(t,b2),x]));
    if(C.transfers.length){ sum.push([],["已轉帳","收款人","金額","狀態"]); C.transfers.forEach(e=>sum.push([nameOf(t,e.from),nameOf(t,e.to),e.twd,e.confirmed?"已確認":"待確認"])); }
    const ex=[["日期","類型","對象","幣別","外幣金額","台幣","匯率"]];
    C.all.filter(e=>e.kind==="exchange"||e.kind==="kitty_in").forEach(e=>ex.push([e.date,e.kind==="exchange"?"換匯":"繳交公費",nameOf(t,e.member),e.cur,e.amount,e.twd,e.amount?r2(e.twd/e.amount*1e4)/1e4:""]));
    const wb=X.utils.book_new();
    const ws1=X.utils.aoa_to_sheet(rows); ws1["!cols"]=[10,18,8,8,6,10,8,14,10,8,10,10,8,24,6,8].map(w=>({wch:w}));
    const ws2=X.utils.aoa_to_sheet(sum); ws2["!cols"]=[{wch:14},{wch:24},{wch:12},{wch:10}];
    X.utils.book_append_sheet(wb,ws2,"結算");
    X.utils.book_append_sheet(wb,ws1,"明細");
    if(ex.length>1){ const ws3=X.utils.aoa_to_sheet(ex); X.utils.book_append_sheet(wb,ws3,"換匯與公費"); }
    const out=X.write(wb,{type:"array",bookType:"xlsx"});
    const fname=`旅帳_${t.name}_${today()}.xlsx`;
    if(S.dl){ await S.dl.save({filename:fname,data:new Blob([out])}); toast("已匯出"); }
    else{ const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); }
  }catch(e){
    if(e?.code==="declined"){} else if(e?.code) toast("匯出未完成"); else toast("匯出元件載入失敗，請稍後再試");
  }finally{ if(b){b.disabled=false; b.innerHTML=`${ic("download")}匯出 Excel`;} }
}

/* 多人編輯衝突 */
const verOf=e=>e?(e.updatedAt||e.createdAt||0):0;
function liveOf(e){ return e?((e.private?S.priv:S.entries)[e.id]||null):null; }
async function conflictOK(t,old){
  if(!old||!isCloud()) return true;
  const cur=liveOf(old);
  if(!cur) return await confirmBox("這筆紀錄已被其他旅伴刪除。要用你目前的內容重新儲存嗎？","重新儲存",false);
  if(verOf(cur)!==verOf(old)&&cur.updatedBy&&cur.updatedBy!==S.uid)
    return await confirmBox(`這筆剛被 ${recorderName(t,cur.updatedBy)} 於 ${timeT(cur.updatedAt)} 修改過。要用你的內容覆蓋對方的修改嗎？`,"覆蓋",true);
  return true;
}
function watchEditing(t,old,reopen){
  if(!old||!isCloud()){ S.editing=null; return; }
  S.editing={id:old.id,priv:!!old.private,base:verOf(old),shown:false,cb:cur=>{
    const box=$("#econflict"); if(!box) return;
    box.innerHTML=cur?`<div class="banner" style="margin:0 0 12px">${ic("edit")}<span class="grow">${esc(recorderName(t,cur.updatedBy))} 剛修改了這筆紀錄</span><button class="lnk" id="cfReload">載入最新</button></div>`
      :`<div class="banner" style="margin:0 0 12px">${ic("trash")}<span class="grow">這筆紀錄已被其他旅伴刪除</span></div>`;
    $("#cfReload")&&($("#cfReload").onclick=()=>reopen(cur));
  }};
}
function checkEditing(){
  const E=S.editing; if(!E||E.shown) return;
  const cur=(E.priv?S.priv:S.entries)[E.id];
  if(!cur){ E.shown=true; E.cb(null); return; }
  if(verOf(cur)!==E.base&&cur.updatedBy&&cur.updatedBy!==S.uid){ E.shown=true; E.cb(cur); }
}

/* 圖片壓縮（收據） */
async function compressImg(file){
  const bmp=await createImageBitmap(file);
  for(const [mx,q] of [[1100,.62],[850,.55],[650,.5]]){
    const sc=Math.min(1,mx/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const d=cv.toDataURL("image/jpeg",q); if(d.length<230000) return d;
  }
  throw new Error("too large");
}

/* 收據辨識 */
async function scanReceipt(file,t,st,draw){
  compressImg(file).then(d=>{ try{ st._setRc&&st._setRc(d); }catch(e){} }).catch(()=>{});
  const box=$("#escanst"); if(!box) return;
  const ctl=new AbortController();
  box.innerHTML=`<div class="note g" style="display:flex;align-items:center;gap:10px"><span class="spin"></span><span class="grow">辨識收據中，約需數秒</span><button class="lnk" id="scanStop">取消</button></div>`;
  $("#scanStop").onclick=()=>ctl.abort();
  const cats=catsOf(t).map(c=>`${c.id}=${c.name}`).join(", ");
  const prompt=`你是旅遊記帳助理。請讀取這張收據或發票照片，回傳單一 JSON 物件，不要其他文字：
{"amount": 數字(實付總額，含稅，不含幣別符號), "currency": "ISO 4217 幣別代碼", "merchant": "店名", "title": "10 字內繁體中文簡短品項或店名", "date": "YYYY-MM-DD 或 null", "category": "分類 id", "isTaxFree": true/false, "address": "收據上的店家地址或 null"}
旅程目的地幣別為 ${t.currency}，若收據未標示幣別請使用 ${t.currency}。
分類 id 只能從以下選一個：${cats}。
無法辨識的欄位填 null。`;
  try{
    const r=await S.sample.json(prompt,{images:[file],signal:ctl.signal});
    if(!r||typeof r!=="object") throw {code:"invalid_json"};
    if(r.amount&&Number(r.amount)>0){ st.amount=String(Number(r.amount)); st.expr=st.amount; }
    if(r.currency&&(r.currency==="TWD"||S.rates.rates[r.currency])) st.cur=r.currency;
    if(r.title||r.merchant) st.title=String(r.title||r.merchant).slice(0,40);
    if(!st.place&&(r.merchant||r.address)) st.place=mapSearch([r.merchant,r.address].filter(Boolean).join(" "),null);
    if(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)) st.date=r.date;
    if(r.category&&catsOf(t).some(c=>c.id===r.category)) st.cat=r.category;
    if($("#eamt")){ $("#ecur").value=st.cur; $("#etitle").value=st.title; $("#edate").value=st.date; draw(); }
    st._drawPlace&&st._drawPlace();
    box.innerHTML=`<div class="note g">已自動填入${r.merchant?`「${esc(r.merchant)}」`:""}的資料，請確認金額與付款方式。${r.isTaxFree?"此筆為免稅消費。":""}</div>`;
  }catch(e){
    const m={cancelled:"",not_granted:"未授權使用辨識功能",rate_limited:"辨識次數過多，請稍後再試",image_rejected:"無法讀取這張照片，請換一張清晰的照片",invalid_json:"無法辨識這張收據，請手動輸入"}[e?.code];
    box.innerHTML=m===""?"":`<div class="note">${esc(m||"辨識失敗，請手動輸入")}</div>`;
    if(e?.code==="not_granted"||e?.code==="sampling_disabled"){ S.canImg=false; $("#escan")?.remove(); }
  }
}

boot();
Object.assign(window,{closeSheet});
</script>
</body>
</html>
