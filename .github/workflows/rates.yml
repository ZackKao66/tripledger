name: 每日更新臺銀匯率
on:
  schedule:
    - cron: "45 1 * * *"   # 每天台灣時間 09:45
    - cron: "15 5 * * 1-5" # 平日台灣時間 13:15 再補抓一次
  workflow_dispatch: {}    # 可在 GitHub 手動執行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_rates.py
      - name: 提交匯率
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rates.json rates-history.json
          git diff --cached --quiet || git commit -m "更新臺銀匯率 $(TZ=Asia/Taipei date +'%Y/%m/%d %H:%M')"
          git push
