name: 產生APP圖示
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install pillow
      - run: python scripts/make_icons.py
      - name: 提交圖示
        run: |
          git config user.name "icon-bot"
          git config user.email "icon-bot@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || git commit -m "產生APP圖示"
          git push
